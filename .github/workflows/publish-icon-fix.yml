name: Publish icon and node fix IPA
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-icon-fix.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: BrowserPrototype-unsigned
          run-id: 43688139252
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish test IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum BrowserPrototype-unsigned.ipa > SHA256SUMS
          cat > notes.md <<'NOTES'
          原节点代理实验版：修复节点测试与启用按钮的点击冲突，并使用用户提供的安卓版 APK 图标。
          
          安装后打开“设置 → 选择和测试原节点”，先点“测试”，握手通过后点击“启用此节点”，再返回浏览器测试。
          
          未签名，需要自行签名安装。仅完成编译和本地模拟网关测试，真实节点的网页代理仍需真机验证。
          原协议所见的异或不是可靠加密，请勿依赖此应用保护隐私；会员、自动切换和 VPN 模式尚未完成。
          NOTES
          gh release create original-node-icon-fix-20261115 BrowserPrototype-unsigned.ipa SHA256SUMS \
            --target 1c90022da306f8038f37ba77973844e9f266c200 \
            --title '原节点按钮与图标修复测试版' --notes-file notes.md --prerelease
