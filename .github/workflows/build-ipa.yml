name: Build unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test local proxy gateway
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 -parse-as-library \
            Sources/OriginalNodeGateway.swift tests/GatewayHarness.swift \
            -o "$RUNNER_TEMP/gateway-harness"
          GATEWAY_BIN="$RUNNER_TEMP/gateway-harness" python3 tests/test_gateway_integration.py
      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild -project BrowserPrototype.xcodeproj -scheme BrowserPrototype \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/browser-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/browser-build/Build/Products/Release-iphoneos/BrowserPrototype.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/BrowserPrototype-unsigned.ipa" Payload)
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BrowserPrototype-unsigned
          path: BrowserPrototype-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
